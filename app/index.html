<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>近くの広告</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1a2740" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: #0f1522; color: #fff;
  }
  /* Google Mapsは初期化時にコンテナへ position:relative を強制的に上書きするため、
     フルスクリーン配置は外側のラッパーで行い、#map自体は 100%/100% でサイズだけ追従させる。 */
  #map-wrap { position: fixed; inset: 0; }
  #map { width: 100%; height: 100%; }

  #status-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 10px 14px;
    background: rgba(15,21,34,.85);
    backdrop-filter: blur(4px);
    font-size: 12px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  #status-text { opacity: .85; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4caf50; display: inline-block; margin-right: 6px;
    box-shadow: 0 0 0 rgba(76,175,80,.6);
    animation: pulse 2s infinite;
  }
  .dot.off { background: #888; animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,175,80,.6); }
    70% { box-shadow: 0 0 0 8px rgba(76,175,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
  }

  #permission-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; z-index: 30;
    background: #0f1522;
  }
  #permission-screen h1 { font-size: 18px; margin-bottom: 8px; }
  #permission-screen p { font-size: 13px; color: #aab2c5; line-height: 1.6; max-width: 320px; }
  #enable-btn {
    margin-top: 20px;
    padding: 14px 28px;
    background: #4c7dff;
    border: none;
    border-radius: 999px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #permission-error { color: #ff8a80; font-size: 12px; margin-top: 12px; min-height: 16px; }

  #ad-card {
    position: fixed;
    left: 12px; right: 12px; bottom: 12px;
    max-width: 420px;
    margin: 0 auto;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    background: #fff;
    color: #1a1a1a;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    display: none;
    z-index: 25;
    transform: translateY(0);
    transition: max-width .2s ease, max-height .2s ease;
  }
  #ad-card.hidden { display: none; }
  #ad-card.expanded {
    max-width: min(94vw, 720px);
    max-height: 90vh;
  }
  #ad-card.expanded #ad-description { max-height: 320px; }
  .ad-card-header {
    position: relative;
    padding-right: 165px;
    cursor: grab;
    touch-action: none;
  }
  .ad-card-header.dragging { cursor: grabbing; }
  #ad-card.collapsed .ad-card-body { display: none; }
  #ad-card.collapsed { padding-bottom: 14px; }
  #ad-card img#ad-thumb {
    display: none;
    width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px;
    background: #eee;
    margin-bottom: 10px;
  }
  #ad-video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
    display: none;
  }
  #ad-video-wrap video, #ad-video-wrap iframe {
    width: 100%; height: 100%; border: none; display: block;
  }
  #unmute-btn {
    position: absolute;
    right: 8px; bottom: 8px;
    background: rgba(0,0,0,.6);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11px;
    cursor: pointer;
    display: none;
  }
  #ad-card .badge {
    display: inline-block; font-size: 10px; color: #4c7dff; background: #eef2ff;
    padding: 2px 8px; border-radius: 999px; margin-bottom: 4px; font-weight: 600;
  }
  #ad-card h3 { font-size: 14px; margin: 0 0 4px; }
  #ad-card p { font-size: 11px; color: #666; margin: 0 0 8px; }
  #ad-card a.cta {
    display: inline-block;
    background: #1a2740; color: #fff; text-decoration: none;
    font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 999px;
  }
  #ad-description-wrap { display: none; margin: 0 0 10px; }
  #ad-description {
    font-size: 15px;
    color: #222;
    line-height: 1.7;
    max-height: 150px;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #e2e4e8;
    border-radius: 8px;
    padding: 10px;
    background: #fafafa;
  }
  #ad-description a { color: #4c7dff; }
  #desc-scroll-hint {
    display: none;
    font-size: 11px;
    color: #888;
    text-align: center;
    margin-top: 4px;
  }
  #ad-description-wrap.scrollable #desc-scroll-hint { display: block; }
  #ad-card .close-btn {
    position: absolute; top: 8px; right: 10px; border: none; background: none;
    font-size: 16px; color: #999; cursor: pointer;
  }
  #ad-card .collapse-btn {
    position: absolute; top: 8px; right: 36px;
    border: 1px solid #ddd; background: #f5f6f8; color: #444;
    font-size: 11px; font-weight: 600; cursor: pointer;
    padding: 4px 10px; border-radius: 999px;
  }
  #ad-card .expand-btn {
    position: absolute; top: 8px; right: 96px;
    border: 1px solid #ddd; background: #f5f6f8; color: #444;
    font-size: 11px; font-weight: 600; cursor: pointer;
    padding: 4px 10px; border-radius: 999px;
  }
  #reopen-btn {
    position: fixed;
    right: 16px; bottom: 16px;
    z-index: 25;
    background: #4c7dff;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    cursor: pointer;
  }
  #reopen-btn.hidden { display: none; }
</style>
</head>
<body>

<div id="map-wrap"><div id="map"></div></div>

<div id="status-bar">
  <span id="status-text"><span class="dot off" id="status-dot"></span>待機中</span>
  <span id="mark-count"></span>
</div>

<div id="permission-screen">
  <h1>近くの広告アプリ</h1>
  <p>
    このアプリを起動したままにすると、登録済みの地点（半径100m）に近づいたとき
    自動的に広告リンクが表示されます。位置情報の利用を許可してください。
  </p>
  <button id="enable-btn">位置情報を許可して開始</button>
  <div id="permission-error"></div>
</div>

<div id="ad-card" class="hidden">
  <div class="ad-card-header" id="ad-drag-handle">
    <span class="badge">近くの広告</span>
    <h3 id="ad-title"></h3>
    <p id="ad-distance"></p>
  </div>
  <button class="close-btn" id="ad-close">✕</button>
  <button class="collapse-btn" id="ad-collapse">たたむ ︿</button>
  <button class="expand-btn" id="ad-expand">拡大 ⤢</button>
  <div class="ad-card-body">
    <div id="ad-video-wrap">
      <button id="unmute-btn">🔇 タップで音声ON</button>
    </div>
    <img id="ad-thumb" src="" alt="" />
    <div id="ad-description-wrap">
      <div id="ad-description"></div>
      <div id="desc-scroll-hint">▼ 枠内をスクロールすると続きが読めます</div>
    </div>
    <a id="ad-link" class="cta" href="#" target="_blank" rel="noopener">広告を見る</a>
  </div>
</div>

<button id="reopen-btn" class="hidden">📍 広告を再表示</button>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
</script>

<script type="module">
  import { marksCollectionRef, onSnapshot } from "../shared/firebase.js";
  import { distanceMeters } from "../shared/geo.js";

  const HYSTERESIS_RATIO = 1.2; // 半径の1.2倍を超えて離れたら再トリガー可能にする
  let map, userMarker, accuracyCircle;
  let marks = [];
  const overlaysById = new Map(); // markId -> { marker, circle }
  const triggeredIds = new Set();
  let currentShownId = null;
  let lastDist = 0;
  let closedMark = null; // ✕で閉じた後、範囲内にいる間だけ再表示ボタンから復活できるようにする

  window.__gmapsReady = function () {
    map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 35.681236, lng: 139.767125 },
      zoom: 15,
      disableDefaultUI: true,
      zoomControl: true,
    });
    // Circleは実機タッチだと当たり判定が反応しないことがあるため、
    // 地図全体のクリック位置と各地点の距離を測って範囲内なら反応させる。
    map.addListener("click", (e) => {
      const lat = e.latLng.lat();
      const lng = e.latLng.lng();
      for (const mark of marks) {
        if (distanceMeters(lat, lng, mark.lat, mark.lng) <= mark.radius) {
          previewMark(mark.id);
          break;
        }
      }
    });
    watchMarks();
  };

  // __gmapsReady を定義した後にスクリプトを読み込むことで、
  // 「コールバック未定義のうちにMaps側が呼び出してしまう」競合を防ぐ。
  const GOOGLE_MAPS_API_KEY = "AIzaSyCOZc45VD2aZRu2mGXdcZ4C3M8CACz7Dz8";
  const gmapsScript = document.createElement("script");
  gmapsScript.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&loading=async&callback=__gmapsReady`;
  gmapsScript.async = true;
  document.head.appendChild(gmapsScript);

  function watchMarks() {
    onSnapshot(marksCollectionRef, (snapshot) => {
      marks = [];
      const seenIds = new Set();
      snapshot.forEach((docSnap) => {
        const id = docSnap.id;
        const data = docSnap.data();
        marks.push({ id, ...data });
        seenIds.add(id);
        upsertMarkOverlay(id, data);
      });
      for (const id of Array.from(overlaysById.keys())) {
        if (!seenIds.has(id)) {
          const entry = overlaysById.get(id);
          entry.marker.setMap(null);
          entry.circle.setMap(null);
          overlaysById.delete(id);
        }
      }
      document.getElementById("mark-count").textContent = `登録地点: ${marks.length}件`;
    });
  }

  function upsertMarkOverlay(id, data) {
    let entry = overlaysById.get(id);
    if (!entry) {
      const marker = new google.maps.Marker({
        position: { lat: data.lat, lng: data.lng },
        map,
        title: data.title,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 6,
          fillColor: "#4c7dff",
          fillOpacity: 1,
          strokeColor: "#fff",
          strokeWeight: 2,
        },
      });
      const circle = new google.maps.Circle({
        map,
        center: { lat: data.lat, lng: data.lng },
        radius: data.radius,
        strokeColor: "#4c7dff",
        strokeOpacity: 0.9,
        strokeWeight: 2,
        fillColor: "#4c7dff",
        fillOpacity: 0.22,
      });
      marker.addListener("click", () => previewMark(id));
      circle.addListener("click", () => previewMark(id));
      marker.addListener("mouseover", () => previewMark(id));
      circle.addListener("mouseover", () => previewMark(id));
      overlaysById.set(id, { marker, circle });
    } else {
      entry.marker.setPosition({ lat: data.lat, lng: data.lng });
      entry.circle.setCenter({ lat: data.lat, lng: data.lng });
      entry.circle.setRadius(data.radius);
    }
  }

  function previewMark(id) {
    // 一覧は onSnapshot のたびに marks 配列ごと作り直されるため、
    // クロージャに古いデータを持たせず常に最新の内容を引く。
    const mark = marks.find((m) => m.id === id);
    if (!mark) return;
    const dist = userMarker
      ? distanceMeters(userMarker.getPosition().lat(), userMarker.getPosition().lng(), mark.lat, mark.lng)
      : NaN;
    showAd(mark, dist);
  }

  function updateUserPosition(lat, lng, accuracy) {
    const pos = { lat, lng };
    if (!userMarker) {
      userMarker = new google.maps.Marker({
        position: pos,
        map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: "#ff5252",
          fillOpacity: 1,
          strokeColor: "#fff",
          strokeWeight: 2,
        },
        zIndex: 999,
        clickable: false, // 現在地表示は演出のみ。重なったマーク円のクリックを奪わないようにする
      });
      accuracyCircle = new google.maps.Circle({
        map,
        center: pos,
        radius: accuracy || 20,
        strokeOpacity: 0,
        fillColor: "#ff5252",
        fillOpacity: 0.12,
        clickable: false,
      });
      map.setCenter(pos);
    } else {
      userMarker.setPosition(pos);
      accuracyCircle.setCenter(pos);
      accuracyCircle.setRadius(accuracy || 20);
    }
  }

  function checkGeofences(lat, lng) {
    let nearest = null;
    for (const mark of marks) {
      const dist = distanceMeters(lat, lng, mark.lat, mark.lng);
      if (!nearest || dist < nearest.dist) nearest = { mark, dist };

      const inside = dist <= mark.radius;
      const farOutside = dist > mark.radius * HYSTERESIS_RATIO;

      if (inside && !triggeredIds.has(mark.id)) {
        triggeredIds.add(mark.id);
        showAd(mark, dist);
      } else if (farOutside && triggeredIds.has(mark.id)) {
        triggeredIds.delete(mark.id);
        if (closedMark && closedMark.id === mark.id) {
          closedMark = null;
          document.getElementById("reopen-btn").classList.add("hidden");
        }
      }
    }

    if (nearest) {
      document.getElementById("status-text").innerHTML =
        `<span class="dot" id="status-dot"></span>最寄地点まで ${Math.round(nearest.dist)}m`;
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function linkify(text) {
    const escaped = escapeHtml(text);
    return escaped
      .replace(/(https?:\/\/[^\s<]+)/g, (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
      .replace(/\n/g, "<br>");
  }

  function parseYouTubeId(url) {
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function isDirectVideoFile(url) {
    return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url);
  }

  function stopVideo() {
    const wrap = document.getElementById("ad-video-wrap");
    wrap.innerHTML = '<button id="unmute-btn">🔇 タップで音声ON</button>';
    wrap.style.display = "none";
    document.getElementById("unmute-btn").style.display = "none";
  }

  function playVideoIfAny(mark) {
    const wrap = document.getElementById("ad-video-wrap");
    if (!mark.videoUrl) {
      wrap.style.display = "none";
      return;
    }
    const youtubeId = parseYouTubeId(mark.videoUrl);
    wrap.style.display = "block";

    if (youtubeId) {
      // YouTube 埋め込み: ミュート自動再生。音量操作はプレイヤー内のコントロールで行う。
      const iframe = document.createElement("iframe");
      iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&mute=1&playsinline=1&rel=0`;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.allowFullscreen = true;
      wrap.innerHTML = "";
      wrap.appendChild(iframe);
    } else if (isDirectVideoFile(mark.videoUrl)) {
      const video = document.createElement("video");
      video.src = mark.videoUrl;
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.controls = false;
      if (mark.thumbnailUrl) video.poster = mark.thumbnailUrl;
      wrap.innerHTML = "";
      wrap.appendChild(video);

      const unmuteBtn = document.createElement("button");
      unmuteBtn.id = "unmute-btn";
      unmuteBtn.textContent = "🔇 タップで音声ON";
      unmuteBtn.style.display = "block";
      unmuteBtn.addEventListener("click", () => {
        video.muted = false;
        unmuteBtn.style.display = "none";
      });
      wrap.appendChild(unmuteBtn);

      video.play().catch(() => {
        // 自動再生がブロックされた場合はミュート状態のまま再試行を促す
      });
    } else {
      // 動画URLだが形式不明な場合は何も再生せず、通常のリンク表示のみ行う
      wrap.style.display = "none";
    }
  }

  function showAd(mark, dist) {
    currentShownId = mark.id;
    lastDist = dist;
    closedMark = null;
    document.getElementById("reopen-btn").classList.add("hidden");
    document.getElementById("ad-title").textContent = mark.title;
    document.getElementById("ad-distance").textContent = Number.isFinite(dist)
      ? `現在地から約${Math.round(dist)}m`
      : "地図から確認中";
    document.getElementById("ad-link").href = mark.adUrl;
    const thumb = document.getElementById("ad-thumb");
    if (mark.thumbnailUrl) {
      thumb.src = mark.thumbnailUrl;
      thumb.style.display = "block";
    } else {
      thumb.style.display = "none";
    }
    const descEl = document.getElementById("ad-description");
    const descWrap = document.getElementById("ad-description-wrap");
    if (mark.description) {
      descEl.innerHTML = linkify(mark.description);
      descWrap.style.display = "block";
      descWrap.classList.toggle("scrollable", descEl.scrollHeight > descEl.clientHeight + 4);
    } else {
      descWrap.style.display = "none";
      descWrap.classList.remove("scrollable");
    }
    playVideoIfAny(mark);
    const card = document.getElementById("ad-card");
    card.classList.remove("hidden");
    card.classList.remove("collapsed");
    card.classList.remove("expanded");
    document.getElementById("ad-collapse").textContent = "たたむ ︿";
    document.getElementById("ad-expand").textContent = "拡大 ⤢";
    card.style.display = "block";

    if (Notification.permission === "granted") {
      try {
        const n = new Notification(`近くの広告: ${mark.title}`, {
          body: "タップして広告を見る",
          tag: mark.id,
        });
        n.onclick = () => {
          window.focus();
          window.open(mark.adUrl, "_blank");
        };
      } catch (e) {
        // 一部モバイルブラウザは直接 Notification コンストラクタ非対応
      }
    }
  }

  document.getElementById("ad-close").addEventListener("click", () => {
    const card = document.getElementById("ad-card");
    card.classList.add("hidden");
    card.style.display = "none";
    stopVideo();
    if (currentShownId) {
      const mark = marks.find((m) => m.id === currentShownId);
      if (mark) {
        closedMark = mark;
        const reopenBtn = document.getElementById("reopen-btn");
        reopenBtn.textContent = `📍 「${mark.title}」を再表示`;
        reopenBtn.classList.remove("hidden");
      }
    }
    currentShownId = null;
  });

  document.getElementById("reopen-btn").addEventListener("click", () => {
    if (closedMark) {
      showAd(closedMark, lastDist);
    }
  });

  document.getElementById("ad-collapse").addEventListener("click", () => {
    const card = document.getElementById("ad-card");
    const btn = document.getElementById("ad-collapse");
    const collapsed = card.classList.toggle("collapsed");
    btn.textContent = collapsed ? "広げる ﹀" : "たたむ ︿";
  });

  document.getElementById("ad-expand").addEventListener("click", () => {
    const card = document.getElementById("ad-card");
    const btn = document.getElementById("ad-expand");
    const expanded = card.classList.toggle("expanded");
    btn.textContent = expanded ? "縮小 ⤡" : "拡大 ⤢";
    if (expanded && card.classList.contains("collapsed")) {
      card.classList.remove("collapsed");
      document.getElementById("ad-collapse").textContent = "たたむ ︿";
    }
  });

  (function setupCardDrag() {
    const card = document.getElementById("ad-card");
    const handle = document.getElementById("ad-drag-handle");
    let dragging = false;
    let startX, startY, startLeft, startTop;

    handle.addEventListener("pointerdown", (e) => {
      dragging = true;
      handle.classList.add("dragging");
      handle.setPointerCapture(e.pointerId);
      const rect = card.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;
      // 自由な位置へドラッグできるよう、初期の left/right/bottom/margin アンカーを解除する
      card.style.left = `${rect.left}px`;
      card.style.top = `${rect.top}px`;
      card.style.right = "auto";
      card.style.bottom = "auto";
      card.style.margin = "0";
    });

    handle.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const rect = card.getBoundingClientRect();
      const maxLeft = Math.max(0, window.innerWidth - rect.width);
      const maxTop = Math.max(0, window.innerHeight - rect.height);
      card.style.left = `${Math.min(Math.max(0, startLeft + dx), maxLeft)}px`;
      card.style.top = `${Math.min(Math.max(0, startTop + dy), maxTop)}px`;
    });

    function endDrag() {
      dragging = false;
      handle.classList.remove("dragging");
    }
    handle.addEventListener("pointerup", endDrag);
    handle.addEventListener("pointercancel", endDrag);
  })();

  document.getElementById("enable-btn").addEventListener("click", async () => {
    const errorEl = document.getElementById("permission-error");
    errorEl.textContent = "";

    if (!("geolocation" in navigator)) {
      errorEl.textContent = "この端末は位置情報に対応していません。";
      return;
    }

    if ("Notification" in window && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch (e) {}
    }

    navigator.geolocation.getCurrentPosition(
      () => {
        document.getElementById("permission-screen").style.display = "none";
        startWatching();
      },
      (err) => {
        errorEl.textContent = "位置情報の許可が必要です。ブラウザの設定を確認してください。";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  function startWatching() {
    navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        updateUserPosition(latitude, longitude, accuracy);
        checkGeofences(latitude, longitude);
      },
      (err) => {
        document.getElementById("status-text").textContent = "位置情報の取得に失敗しました";
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
  }
</script>

</body>
</html>
