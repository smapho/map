<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>位置連動広告システム</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: #0f1522;
    color: #fff;
  }
  .card {
    max-width: 420px;
    padding: 32px;
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 13px; color: #aab2c5; line-height: 1.6; }
  .links { display: flex; gap: 12px; margin-top: 24px; }
  .links a {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .admin { background: #eef2ff; color: #1a2740; }
  .app { background: #4c7dff; color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>位置連動広告システム</h1>
    <p>
      PC用管理画面で地図上に広告マークを登録し、
      スマホ用アプリで半径100m以内に入ると自動的に広告を表示します。
    </p>
    <div class="links">
      <a class="admin" href="./admin/">PC管理画面</a>
      <a class="app" href="./app/">スマホ用アプリ</a>
    </div>
  </div>
</body>
</html>
